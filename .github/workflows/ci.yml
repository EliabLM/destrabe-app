name: CI

on:
  # Sin filtro de rama base: también corre en PR apilados.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks rápidos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm run build -w @destrabe/shared
      - run: npx prisma generate --schema=backend/prisma/schema.prisma
      - run: npm run ts:check -w @destrabe/app
      - run: npm run build -w @destrabe/backend
      - run: npm test
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - name: npm audit (informativo)
        continue-on-error: true
        run: npm audit --omit=dev

  db:
    name: Contratos DB
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://destrabe_ci:ci_only_password@localhost:5432/destrabe_ci?schema=public
      SHADOW_DATABASE_URL: postgresql://destrabe_ci:ci_only_password@localhost:5432/destrabe_shadow?schema=public
      NODE_ENV: test
      PAYMENT_GATEWAY: stub
    services:
      postgres:
        # Misma imagen prevista en producción (ADR-016): build multiarch de
        # postgis/postgis 16-3.4, que también publica arm64.
        image: imresamu/postgis:16-3.4
        env:
          POSTGRES_USER: destrabe_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: destrabe_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U destrabe_ci -d destrabe_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w @destrabe/shared
      - run: npx prisma generate --schema=backend/prisma/schema.prisma
      - name: Deriva schema.prisma ↔ migraciones
        run: |
          echo 'CREATE DATABASE destrabe_shadow' \
            | npx prisma db execute --url "$DATABASE_URL" --stdin
          npx prisma migrate diff \
            --from-migrations backend/prisma/migrations \
            --to-schema-datamodel backend/prisma/schema.prisma \
            --shadow-database-url "$SHADOW_DATABASE_URL" \
            --exit-code
      - run: npx prisma migrate deploy --schema=backend/prisma/schema.prisma
      # Unit + DB con los umbrales de vitest.config.ts: falla si se bajan.
      - run: npm run test:coverage

  docker:
    name: Imagen Docker (Node 26)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: destrabe-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Node de la imagen es v26.x
        run: |
          v=$(docker run --rm destrabe-backend:ci node --version)
          echo "node $v"
          [[ "$v" == v26.* ]]
